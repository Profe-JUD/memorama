<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ordena el relato</title>
<style>
  :root {
    --papel: #f6f1e7;
    --tinta: #3a3226;
    --carta: #ffffff;
    --acento: #b0562e;
    --acento-claro: #e8c9b0;
    --verde: #4a7c59;
    --sombra: 0 2px 6px rgba(58, 50, 38, 0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--papel);
    color: var(--tinta);
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  header {
    text-align: center;
    padding: 10px 16px 6px;
  }
  header h1 {
    font-size: clamp(1.1rem, 2.5vw, 1.5rem);
    letter-spacing: 0.02em;
  }
  header p {
    font-size: clamp(0.8rem, 1.8vw, 0.95rem);
    opacity: 0.75;
    margin-top: 2px;
  }

  /* ---------- Fase 1: ordenar ---------- */
  #pantalla-ordenar[hidden] { display: none; }
  #pantalla-ordenar {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 12px 14px;
    min-height: 0;
  }
  #lista {
    list-style: none;
    width: min(680px, 100%);
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: clamp(4px, 0.9vh, 10px);
    min-height: 0;
  }
  .carta {
    background: var(--carta);
    border: 1.5px solid #dcd3c2;
    border-radius: 10px;
    box-shadow: var(--sombra);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: clamp(6px, 1.2vh, 12px) 14px;
    font-size: clamp(0.95rem, 2.2vw, 1.25rem);
    font-family: Georgia, "Times New Roman", serif;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    flex: 1;
  }
  .carta .asa {
    color: #b8ab94;
    font-size: 1.1em;
    flex: none;
  }
  .carta .altavoz {
    margin-left: auto;
    flex: none;
    opacity: 0.45;
    font-size: 0.95em;
  }
  .carta.hablando {
    border-color: var(--acento);
    background: #fdf3ec;
  }
  .carta.hablando .altavoz { opacity: 1; }
  .carta.arrastrando {
    position: fixed;
    z-index: 50;
    opacity: 0.95;
    box-shadow: 0 10px 24px rgba(58, 50, 38, 0.35);
    cursor: grabbing;
    pointer-events: none;
  }
  .hueco {
    border: 2px dashed var(--acento-claro);
    border-radius: 10px;
    background: rgba(232, 201, 176, 0.25);
    flex: 1;
  }
  #btn-listo {
    margin-top: 10px;
    padding: 10px 26px;
    font-size: 1rem;
    border: none;
    border-radius: 24px;
    background: var(--verde);
    color: #fff;
    cursor: pointer;
    box-shadow: var(--sombra);
    flex: none;
  }
  #btn-listo:active { transform: scale(0.97); }
  body.ocupado #lista .carta { pointer-events: none; }
  body.ocupado #btn-listo { visibility: hidden; }

  /* ---------- Diálogo ---------- */
  #velo {
    position: fixed;
    inset: 0;
    background: rgba(58, 50, 38, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  #velo[hidden] { display: none; }
  #dialogo {
    background: var(--carta);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    padding: 28px 32px;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  #dialogo p {
    font-size: clamp(1.15rem, 3vw, 1.5rem);
    margin-bottom: 22px;
  }
  #dialogo .botones {
    display: flex;
    gap: 16px;
    justify-content: center;
  }
  #dialogo button {
    min-width: 110px;
    padding: 12px 24px;
    font-size: 1.15rem;
    border: none;
    border-radius: 28px;
    cursor: pointer;
    box-shadow: var(--sombra);
  }
  #btn-si { background: var(--verde); color: #fff; }
  #btn-no { background: var(--acento); color: #fff; }
  #dialogo button:active { transform: scale(0.97); }

  /* ---------- Fase 2: pantalla dividida ---------- */
  #pantalla-final {
    flex: 1;
    display: flex;
    gap: 14px;
    padding: 10px 14px 16px;
    align-items: stretch;
  }
  #pantalla-final[hidden] { display: none; }
  .panel {
    flex: 1;
    background: var(--carta);
    border: 1.5px solid #dcd3c2;
    border-radius: 14px;
    box-shadow: var(--sombra);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .panel .etiqueta {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--acento);
    margin-bottom: 8px;
  }
  .panel h2 {
    font-family: Georgia, serif;
    font-size: clamp(1.1rem, 2.6vw, 1.45rem);
    margin-bottom: 2px;
    min-height: 1.3em;
  }
  .panel .autor {
    font-size: 0.85rem;
    font-style: italic;
    opacity: 0.7;
    margin-bottom: 10px;
  }
  .panel .texto {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(0.95rem, 2.2vw, 1.15rem);
    line-height: 1.65;
    text-align: justify;
  }
  .panel.leyendo { border-color: var(--acento); background: #fdf7f1; }
  #zona-titulo { margin-bottom: 12px; }
  #zona-titulo label {
    display: block;
    font-size: clamp(0.95rem, 2.2vw, 1.1rem);
    margin-bottom: 8px;
  }
  #fila-titulo { display: flex; gap: 8px; }
  #campo-titulo {
    flex: 1;
    padding: 10px 12px;
    font-size: 1.05rem;
    font-family: Georgia, serif;
    border: 2px solid var(--acento-claro);
    border-radius: 10px;
    min-width: 0;
  }
  #campo-titulo:focus { outline: none; border-color: var(--acento); }
  #btn-titulo-ok {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    background: var(--verde);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  #barra-fin {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background: rgba(246, 241, 231, 0.95);
    border-top: 1.5px solid #dcd3c2;
    z-index: 60;
  }
  #barra-fin[hidden] { display: none; }
  #barra-fin span { font-size: 1.05rem; }
  #btn-otra {
    padding: 10px 22px;
    border: none;
    border-radius: 24px;
    background: var(--acento);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: var(--sombra);
  }
  @media (max-width: 640px) {
    #pantalla-final { flex-direction: column; overflow-y: auto; }
    .carta { font-size: 0.95rem; }
  }
</style>
</head>
<body>

<header id="cabecera">
  <h1>Ordena el relato</h1>
  <p>Toca una línea para escucharla · arrástrala para moverla</p>
</header>

<main id="pantalla-ordenar">
  <ol id="lista"></ol>
  <button id="btn-listo" type="button">He terminado ✓</button>
</main>

<section id="pantalla-final" hidden>
  <div class="panel" id="panel-jugador">
    <div class="etiqueta">Tu versión</div>
    <div id="zona-titulo" hidden>
      <label for="campo-titulo" id="pregunta-titulo">¿Qué título le pondrías al relato corto?</label>
      <div id="fila-titulo">
        <input id="campo-titulo" type="text" maxlength="80" autocomplete="off"
               placeholder="Escribe aquí tu título…">
        <button id="btn-titulo-ok" type="button">OK</button>
      </div>
    </div>
    <h2 id="titulo-jugador"></h2>
    <div class="autor" id="autor-jugador" hidden>tu versión del relato</div>
    <p class="texto" id="texto-jugador"></p>
  </div>
  <div class="panel" id="panel-original">
    <div class="etiqueta">El relato original</div>
    <h2 id="titulo-original" hidden>Una vida</h2>
    <div class="autor" id="autor-original" hidden>Adolfo Bioy Casares</div>
    <p class="texto" id="texto-original"></p>
  </div>
</section>

<div id="velo" hidden>
  <div id="dialogo" role="alertdialog">
    <p id="dialogo-texto"></p>
    <div class="botones">
      <button id="btn-si" type="button">Sí</button>
      <button id="btn-no" type="button">No</button>
    </div>
  </div>
</div>

<div id="barra-fin" hidden>
  <span>¡Actividad terminada! 👏</span>
  <button id="btn-otra" type="button">Volver a jugar</button>
</div>

/* ---------- Audio ---------- */
const reproductor = new Audio();
let alTerminarAudio = null;

function reproducir(nombre) {
  return new Promise(resolve => {
    reproductor.pause();
    if (alTerminarAudio) { alTerminarAudio(); alTerminarAudio = null; }
    const limpiar = () => {
      reproductor.removeEventListener("ended", limpiar);
      reproductor.removeEventListener("error", limpiar);
      alTerminarAudio = null;
      resolve();
    };
    alTerminarAudio = limpiar;
    reproductor.addEventListener("ended", limpiar);
    reproductor.addEventListener("error", limpiar);
    reproductor.src = AUDIO[nombre];
    reproductor.currentTime = 0;
    reproductor.play().catch(limpiar);
  });
}

/* ---------- Barajar (nunca el orden original) ---------- */
function barajar() {
  const orden = LINEAS.map((_, i) => i);
  do {
    for (let i = orden.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [orden[i], orden[j]] = [orden[j], orden[i]];
    }
  } while (orden.every((v, i) => v === i));
  return orden;
}

/* ---------- Construir la lista ---------- */
const lista = document.getElementById("lista");

function construirLista() {
  lista.innerHTML = "";
  for (const idx of barajar()) {
    const linea = LINEAS[idx];
    const li = document.createElement("li");
    li.className = "carta";
    li.dataset.id = linea.id;
    li.innerHTML = '<span class="asa">≡</span><span class="frase"></span><span class="altavoz">🔊</span>';
    li.querySelector(".frase").textContent = linea.texto;
    lista.appendChild(li);
  }
}

function ordenActual() {
  return [...lista.querySelectorAll(".carta")].map(li => {
    return LINEAS.find(l => l.id === li.dataset.id);
  });
}

/* ---------- Arrastrar y tocar (pointer events) ---------- */
let arrastre = null;

lista.addEventListener("pointerdown", ev => {
  if (fase !== "ordenar") return;
  const carta = ev.target.closest(".carta");
  if (!carta) return;
  ev.preventDefault();
  registrarActividad();
  const rect = carta.getBoundingClientRect();
  arrastre = {
    carta, movido: false,
    inicioY: ev.clientY,
    dedoY: ev.clientY - rect.top,
    ancho: rect.width, alto: rect.height,
    izquierda: rect.left,
    hueco: null,
    puntero: ev.pointerId
  };
  try { carta.setPointerCapture(ev.pointerId); } catch (e) { /* sin captura: el arrastre sigue */ }
});

lista.addEventListener("pointermove", ev => {
  if (!arrastre || ev.pointerId !== arrastre.puntero) return;
  const d = arrastre;
  if (!d.movido) {
    if (Math.abs(ev.clientY - d.inicioY) < 8) return;
    d.movido = true;
    d.hueco = document.createElement("li");
    d.hueco.className = "hueco";
    d.hueco.style.height = d.alto + "px";
    d.carta.before(d.hueco);
    d.carta.classList.add("arrastrando");
    d.carta.style.width = d.ancho + "px";
    d.carta.style.left = d.izquierda + "px";
  }
  d.carta.style.top = (ev.clientY - d.dedoY) + "px";
  const centro = ev.clientY;
  const otras = [...lista.querySelectorAll(".carta:not(.arrastrando)")];
  let destino = null;
  for (const otra of otras) {
    const r = otra.getBoundingClientRect();
    if (centro < r.top + r.height / 2) { destino = otra; break; }
  }
  if (destino) destino.before(d.hueco);
  else lista.appendChild(d.hueco);
});

function terminarArrastre(ev) {
  if (!arrastre || ev.pointerId !== arrastre.puntero) return;
  const d = arrastre;
  arrastre = null;
  registrarActividad();
  if (d.movido) {
    d.carta.classList.remove("arrastrando");
    d.carta.style.cssText = "";
    d.hueco.replaceWith(d.carta);
  } else {
    hablarCarta(d.carta);
  }
}
lista.addEventListener("pointerup", terminarArrastre);
lista.addEventListener("pointercancel", terminarArrastre);

async function hablarCarta(carta) {
  lista.querySelectorAll(".carta.hablando").forEach(c => c.classList.remove("hablando"));
  carta.classList.add("hablando");
  await reproducir(carta.dataset.id);
  carta.classList.remove("hablando");
  registrarActividad();
}

/* ---------- Inactividad ---------- */
function registrarActividad() {
  if (temporizador) clearTimeout(temporizador);
  temporizador = null;
  if (fase !== "ordenar" || preguntado) return;
  temporizador = setTimeout(preguntarSiTermino, INACTIVIDAD_MS);
}

async function preguntarSiTermino() {
  if (fase !== "ordenar" || preguntado) return;
  preguntado = true;
  const respuesta = mostrarDialogo("¿Has terminado?");
  reproducir("p_has_terminado");
  const si = await respuesta;
  preguntado = false;
  if (si) {
    await revisarVersion();
  } else {
    await reproducir("p_vale");
    registrarActividad();
  }
}

/* ---------- Diálogo Sí / No ---------- */
const velo = document.getElementById("velo");
const dialogoTexto = document.getElementById("dialogo-texto");
const btnSi = document.getElementById("btn-si");
const btnNo = document.getElementById("btn-no");
let resolverDialogo = null;

function mostrarDialogo(pregunta) {
  dialogoTexto.textContent = pregunta;
  velo.hidden = false;
  if (temporizador) clearTimeout(temporizador);
  return new Promise(resolve => { resolverDialogo = resolve; });
}
btnSi.addEventListener("click", () => cerrarDialogo(true));
btnNo.addEventListener("click", () => cerrarDialogo(false));
function cerrarDialogo(valor) {
  velo.hidden = true;
  if (resolverDialogo) { const r = resolverDialogo; resolverDialogo = null; r(valor); }
}

/* ---------- Botón "He terminado" ---------- */
document.getElementById("btn-listo").addEventListener("click", () => {
  if (fase !== "ordenar") return;
  registrarActividad();
  revisarVersion();
});

/* ---------- Reproducir la versión del jugador y preguntar ---------- */
async function revisarVersion() {
  fase = "reproduciendo";
  if (temporizador) clearTimeout(temporizador);
  document.body.classList.add("ocupado");

  const cartas = [...lista.querySelectorAll(".carta")];
  for (const carta of cartas) {
    carta.classList.add("hablando");
    carta.scrollIntoView({ block: "nearest", behavior: "smooth" });
    await reproducir(carta.dataset.id);
    carta.classList.remove("hablando");
    await new Promise(r => setTimeout(r, 250));
  }

  fase = "dialogo";
  const respuesta = mostrarDialogo("¿Quieres hacer algún cambio?");
  reproducir("p_cambio");
  const cambiar = await respuesta;

  if (cambiar) {
    await reproducir("p_vale");
    document.body.classList.remove("ocupado");
    fase = "ordenar";
    registrarActividad();
  } else {
    mostrarPantallaFinal();
  }
}

/* ---------- Pantalla dividida + título ---------- */
const pantallaFinal = document.getElementById("pantalla-final");

function mostrarPantallaFinal() {
  fase = "final";
  if (temporizador) clearTimeout(temporizador);
  document.getElementById("pantalla-ordenar").hidden = true;
  document.getElementById("cabecera").hidden = true;
  document.getElementById("texto-jugador").textContent =
    ordenActual().map(l => l.texto).join(" ");
  document.getElementById("texto-original").textContent = TEXTO_ORIGINAL;
  pantallaFinal.hidden = false;

  const zona = document.getElementById("zona-titulo");
  zona.hidden = false;
  reproducir("p_titulo");
  const campo = document.getElementById("campo-titulo");
  campo.focus();

  const confirmar = () => {
    const titulo = campo.value.trim();
    if (!titulo) { campo.focus(); return; }
    zona.hidden = true;
    document.getElementById("titulo-jugador").textContent = titulo;
    document.getElementById("autor-jugador").hidden = false;
    document.getElementById("titulo-original").hidden = false;
    document.getElementById("autor-original").hidden = false;
    preguntarEscucharOtraVez();
  };
  document.getElementById("btn-titulo-ok").addEventListener("click", confirmar);
  campo.addEventListener("keydown", ev => { if (ev.key === "Enter") confirmar(); });
}

async function preguntarEscucharOtraVez() {
  const quiere = await mostrarDialogo("¿Quieres escuchar el relato corto otra vez?");
  if (quiere) {
    const panel = document.getElementById("panel-original");
    panel.classList.add("leyendo");
    await reproducir("relato_completo");
    panel.classList.remove("leyendo");
  }
  document.getElementById("barra-fin").hidden = false;
}

document.getElementById("btn-otra").addEventListener("click", () => location.reload());

/* ---------- Inicio ---------- */
construirLista();
registrarActividad();
</script>
