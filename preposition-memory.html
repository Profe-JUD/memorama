<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorama - Las preposiciones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            color: white;
            font-size: 1.2em;
            flex-wrap: wrap;
        }

        .stat {
            background: rgba(255, 255, 255, 0.25);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #fda085 0%, #f6d365 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 2em;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            position: relative;
            overflow: hidden;
            padding: 4px;
        }

        .card:hover:not(.matched):not(.flipped) {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .card:active {
            transform: scale(0.98);
        }

        .card.flipped {
            background: white;
            color: #333;
            font-size: 0.75em;
            padding: 4px;
            text-align: center;
            line-height: 1.05;
            font-weight: 600;
            word-break: keep-all;
            hyphens: none;
        }

        .card.matched {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: white;
            cursor: default;
            animation: pulse 0.5s ease;
            font-size: 0.75em;
            padding: 4px;
            text-align: center;
            line-height: 1.05;
            font-weight: 600;
            word-break: keep-all;
            hyphens: none;
        }

        .card svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        
        @keyframes blinkCard {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .card.blinking {
            animation: blinkCard 0.45s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            color: #fda085;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        .message {
            text-align: center;
            color: white;
            font-size: 1.3em;
            margin-top: 20px;
            min-height: 30px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .message.success {
            color: #fff;
            font-weight: bold;
            font-size: 1.4em;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8em; }
            .stats { gap: 15px; font-size: 1em; }
            .game-board { gap: 8px; padding: 15px; }
            .card.flipped, .card.matched { font-size: 0.6em; padding: 3px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Memorama</h1>
        <h2 style="color: white; text-align: center; margin-bottom: 30px; font-size: 1.2em;">Las preposiciones de lugar</h2>

        <div class="stats">
            <div class="stat">Movimientos: <span id="moves">0</span></div>
            <div class="stat">Pares: <span id="pairs">0</span>/12</div>
            <div class="stat">Tiempo: <span id="timer">0</span>s</div>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="controls">
            <button onclick="resetGame()">🔄 Reiniciar</button>
            <button onclick="showHint()">💡 Pista</button>
        </div>

        <div class="message" id="message"></div>
    </div>

        const audioCache = {};
        let currentAudio = null;
        let matchAnimating = false;

        function pickVoice() {
            return Math.random() < 0.5 ? 'girl' : 'boy';
        }

        function _getEntry(text, voiceKey) {
            const entry = SPANISH_AUDIO[text];
            if (!entry) return null;
            return entry[voiceKey] || entry.girl || entry.boy || null;
        }

        function speakSpanish(text, voiceKey) {
            voiceKey = voiceKey || pickVoice();
            try {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                }
                const b64 = _getEntry(text, voiceKey);
                if (!b64) {
                    fallbackSpeak(text);
                    return;
                }
                const cacheKey = text + '|' + voiceKey;
                if (!audioCache[cacheKey]) {
                    audioCache[cacheKey] = new Audio('data:audio/mp3;base64,' + b64);
                }
                currentAudio = audioCache[cacheKey];
                currentAudio.currentTime = 0;
                const p = currentAudio.play();
                if (p) p.catch(() => fallbackSpeak(text));
            } catch (e) {
                fallbackSpeak(text);
            }
        }

        function speakSpanishAsync(text, voiceKey) {
            voiceKey = voiceKey || pickVoice();
            return new Promise((resolve) => {
                try {
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                    }
                    const b64 = _getEntry(text, voiceKey);
                    if (!b64) {
                        fallbackSpeak(text);
                        setTimeout(resolve, 1500);
                        return;
                    }
                    const cacheKey = text + '|' + voiceKey;
                    if (!audioCache[cacheKey]) {
                        audioCache[cacheKey] = new Audio('data:audio/mp3;base64,' + b64);
                    }
                    currentAudio = audioCache[cacheKey];
                    currentAudio.currentTime = 0;
                    const onEnd = () => { currentAudio.removeEventListener('ended', onEnd); resolve(); };
                    currentAudio.addEventListener('ended', onEnd);
                    const p = currentAudio.play();
                    if (p) p.catch(() => {
                        currentAudio.removeEventListener('ended', onEnd);
                        fallbackSpeak(text);
                        setTimeout(resolve, 1500);
                    });
                } catch (e) {
                    fallbackSpeak(text);
                    setTimeout(resolve, 1500);
                }
            });
        }

        function fallbackSpeak(text) {
            if (!('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const utt = new SpeechSynthesisUtterance(text);
                utt.lang = 'es-ES';
                utt.rate = 0.85;
                const voices = window.speechSynthesis.getVoices();
                const voice = voices.find(v => v.lang === 'es-ES')
                    || voices.find(v => v.lang.toLowerCase().startsWith('es'));
                if (voice) utt.voice = voice;
                window.speechSynthesis.speak(utt);
            } catch (e) {}
        }

        function initGame() {
            gameState.cards = shuffleArray(cardPairs).map((pair, index) => ({
                ...pair,
                id: index
            }));
            gameState.flipped = [];
            gameState.matched = [];
            gameState.moves = 0;
            gameState.pairs = 0;
            gameState.gameActive = true;
            gameState.startTime = Date.now();

            renderBoard();
            updateStats();
            startTimer();
            document.getElementById('message').textContent = '¡Vamos a jugar! 🎮';
        }

        function renderBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';

            gameState.cards.forEach(card => {
                const cardEl = document.createElement('button');
                cardEl.className = 'card';
                cardEl.id = `card-${card.id}`;

                const isRevealed = gameState.matched.includes(card.id) || gameState.flipped.includes(card.id);

                if (isRevealed) {
                    cardEl.classList.add(gameState.matched.includes(card.id) ? 'matched' : 'flipped');
                    if (card.isImage) {
                        cardEl.innerHTML = svgImages[card.name];
                    } else {
                        cardEl.innerHTML = card.name;
                    }
                } else {
                    cardEl.innerHTML = '?';
                }

                cardEl.addEventListener('click', () => flipCard(card.id));
                cardEl.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    flipCard(card.id);
                });

                board.appendChild(cardEl);
            });
        }

        function flipCard(id) {
            if (matchAnimating) return;
            const card = gameState.cards[id];
            // Klick auf bereits aufgedeckte Wortkarte: Audio erneut abspielen
            if (gameState.matched.includes(id)) {
                if (!card.isImage) {
                    speakSpanish(card.name);
                }
                return;
            }
            if (!gameState.gameActive) return;
            // 3. Klick: alte 2 unmatched Karten verdecken
            if (gameState.flipped.length >= 2) {
                gameState.flipped = [];
                renderBoard();
            }
            if (gameState.flipped.includes(id)) return;

            gameState.flipped.push(id);

            // Pruefe ob 2. Karte und ob Match wird
            let willMatch = false;
            if (gameState.flipped.length === 2) {
                const [_id1, _id2] = gameState.flipped;
                const _c1 = gameState.cards[_id1];
                const _c2 = gameState.cards[_id2];
                willMatch = _c1.name === _c2.name && _c1.isImage !== _c2.isImage;
            }

            // Isolierte Sprachausgabe nur bei Wortkarte UND wenn kein Match (Match-Animation hat Vorrang)
            if (!card.isImage && !willMatch) {
                speakSpanish(card.name);
            }
            renderBoard();
            if (gameState.flipped.length === 2) {
                gameState.moves++;
                updateStats();
                checkMatch();
            }
        }

        async function checkMatch() {
            if (gameState.flipped.length !== 2) return;
            const [id1, id2] = gameState.flipped;
            const card1 = gameState.cards[id1];
            const card2 = gameState.cards[id2];
            const match = card1.name === card2.name && card1.isImage !== card2.isImage;
            if (match) {
                matchAnimating = true;
                const imgId = card1.isImage ? id1 : id2;
                const wordId = card1.isImage ? id2 : id1;
                const wordName = card1.name;

                const phraseVoice = pickVoice();
                const wordVoice = phraseVoice === 'girl' ? 'boy' : 'girl';

                const imgEl = document.getElementById('card-' + imgId);
                if (imgEl) imgEl.classList.add('blinking');
                await speakSpanishAsync('La preposición es', phraseVoice);
                if (imgEl) imgEl.classList.remove('blinking');

                const wordEl = document.getElementById('card-' + wordId);
                if (wordEl) wordEl.classList.add('blinking');
                await speakSpanishAsync(wordName, wordVoice);
                if (wordEl) wordEl.classList.remove('blinking');

                gameState.matched.push(id1, id2);
                gameState.pairs++;
                gameState.flipped = [];
                updateStats();
                renderBoard();
                matchAnimating = false;
                if (gameState.pairs === 12) endGame();
            }
        }

        function updateStats() {
            document.getElementById('moves').textContent = gameState.moves;
            document.getElementById('pairs').textContent = gameState.pairs;
        }

        function startTimer() {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
                document.getElementById('timer').textContent = elapsed;
            }, 1000);
        }

        function endGame() {
            gameState.gameActive = false;
            clearInterval(gameState.timerInterval);
            const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
            document.getElementById('message').innerHTML =
                `🎉 ¡Felicidades! Has encontrado todos los pares.<br>Movimientos: ${gameState.moves} | Tiempo: ${elapsed}s`;
            document.getElementById('message').classList.add('success');
        }

        function resetGame() {
            clearInterval(gameState.timerInterval);
            document.getElementById('message').textContent = '';
            document.getElementById('message').classList.remove('success');
            initGame();
        }

        function showHint() {
            const unmatched = gameState.cards.filter(c => !gameState.matched.includes(c.id) && !gameState.flipped.includes(c.id));
            if (unmatched.length === 0) return;
            const random = unmatched[Math.floor(Math.random() * unmatched.length)];
            const german = prepositions.find(p => p.name === random.name).german;
            document.getElementById('message').textContent = `💡 Pista: busca "${random.name}"`;
            document.getElementById('message').classList.remove('success');
        }

        initGame();
    </script>
</body>
</html>
